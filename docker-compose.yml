
services:
  app:
    image: compliguard/app:latest
    build:
      context: .
      dockerfile: Dockerfile
      # Pin the production stage. Without this, Docker builds the last stage in
      # the Dockerfile, which is `development` (npm run dev / Turbopack) and
      # silently turns prod deploys into dev — broken hydration, source mounts,
      # the works. docker-compose.dev.yml overrides this to `development`.
      target: runner
    ports:
      - "${PORT:-3030}:3030"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://compliguard:${POSTGRES_PASSWORD:-compliguard}@postgres:5432/compliguard
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3030}
      - NEXTAUTH_URL_INTERNAL=${NEXTAUTH_URL_INTERNAL:-http://localhost:3030}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - LOCAL_STORAGE_PATH=/data/uploads
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-mock}
      - POSTMARK_TOKEN=${POSTMARK_TOKEN:-}
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - REDIS_URL=redis://redis:6379
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3030/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=compliguard
      - POSTGRES_USER=compliguard
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-compliguard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compliguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-compliguard}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-compliguard123}
    volumes:
      - minio_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  redis_data:
  uploads_data:
  nginx_logs:
